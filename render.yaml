# Blueprint de Render.com: despliega el backend completo (PostgreSQL + 12 microservicios + API Gateway).
# Render > New > Blueprint > este repositorio. Todo en plan gratuito.
# Las URLs entre servicios son las publicas de Render (https://<nombre>.onrender.com).

databases:
  - name: eam-itstuki-db
    plan: free
    region: virginia
    databaseName: esports_arena
    user: esports

envVarGroups:
  - name: eam-itstuki-comun
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EUREKA_ENABLED
        value: "false"
      - key: JWT_SECRETO
        generateValue: true
      - key: AUTH_SERVICE_URL
        value: https://eam-itstuki-auth.onrender.com
      - key: USER_SERVICE_URL
        value: https://eam-itstuki-user.onrender.com
      - key: TEAM_SERVICE_URL
        value: https://eam-itstuki-team.onrender.com
      - key: TOURNAMENT_SERVICE_URL
        value: https://eam-itstuki-tournament.onrender.com
      - key: REGISTRATION_SERVICE_URL
        value: https://eam-itstuki-registration.onrender.com
      - key: SANCTION_SERVICE_URL
        value: https://eam-itstuki-sanction.onrender.com
      - key: MATCH_SERVICE_URL
        value: https://eam-itstuki-match.onrender.com
      - key: GAME_SERVICE_URL
        value: https://eam-itstuki-game.onrender.com
      - key: RESULT_SERVICE_URL
        value: https://eam-itstuki-result.onrender.com
      - key: RANKING_SERVICE_URL
        value: https://eam-itstuki-ranking.onrender.com
      - key: PRIZE_SERVICE_URL
        value: https://eam-itstuki-prize.onrender.com
      - key: NOTIFICATION_SERVICE_URL
        value: https://eam-itstuki-notification.onrender.com

services:
  - type: web
    name: eam-itstuki-auth
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Esports-arena-manager/backend/auth-service/Dockerfile
    dockerContext: ./Esports-arena-manager/backend/auth-service
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - Esports-arena-manager/backend/auth-service/**
    envVars:
      - fromGroup: eam-itstuki-comun
      - key: DATABASE_URL
        fromDatabase:
          name: eam-itstuki-db
          property: connectionString
      - key: DB_USUARIO
        fromDatabase:
          name: eam-itstuki-db
          property: user
      - key: DB_CLAVE
        fromDatabase:
          name: eam-itstuki-db
          property: password

  - type: web
    name: eam-itstuki-user
    runtime: docker
    plan: free
