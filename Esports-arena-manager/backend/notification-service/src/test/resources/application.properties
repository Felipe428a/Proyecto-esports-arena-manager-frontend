# Pruebas: H2 en memoria (modo PostgreSQL), sin Eureka ni datos iniciales.
# Este archivo complementa (no reemplaza) src/main/resources/application.yml
spring.datasource.url=jdbc:h2:mem:notificaciones;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=notificaciones
app.jwt.secreto=clave-de-pruebas-esports-arena-manager-de-32-bytes-o-mas
app.datos-iniciales=false
eureka.client.enabled=false
